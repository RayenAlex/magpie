name: Prewalk sync

# RayenAlex/magpie's maintenance pipeline: every 6 hours (and on every push
# to main or prewalk-maintenance) merge the fork's main and yetone/magpie's
# main into prewalk-maintenance, check the candidate, and only then advance
# both fork branches and move the prewalk-latest image. Nothing here deploys
# anything.
#
# Checks and publication are two jobs of one workflow. The sync job never
# holds write access to the branches; the publish job alone mints the
# fork's app token, the only credential that may push a candidate which
# changes workflow files (GITHUB_TOKEN has no workflows permission, and
# GitHub rejects such a push with "refusing to allow a GitHub App to
# create or update workflow files without `workflows` permission"). The
# publish app's own pushes are this pipeline's output: their runs are
# skipped and kept out of the real sync's concurrency group, while other
# workflows treat them like any push.
# See docs/prewalk-maintenance.md for the rules and the failure edges.

on:
  push:
    branches: [main, prewalk-maintenance]
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

concurrency:
  # a run the publish app's own push started is skipped, so it gets its
  # own group and never queues ahead of (or beside) a real sync
  group: prewalk-${{ (github.event_name == 'push' && vars.PREWALK_SYNC_BOT != '' && github.actor == vars.PREWALK_SYNC_BOT) && 'app-push' || 'sync' }}
  cancel-in-progress: false

env:
  FORK_URL: https://github.com/RayenAlex/magpie.git
  UPSTREAM_URL: https://github.com/yetone/magpie.git
  # lowercase on purpose: ghcr.io rejects RayenAlex
  IMAGE: ghcr.io/rayenalex/magpie

jobs:
  sync:
    # a hard guard: on yetone/magpie this would merge the repo into itself
    # and push over yetone's own branches and image. The publish app's own
    # pushes are skipped too: they are this pipeline's output, not input.
    if: github.repository == 'RayenAlex/magpie' && (github.event_name != 'push' || vars.PREWALK_SYNC_BOT == '' || github.actor != vars.PREWALK_SYNC_BOT)
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    permissions:
      contents: read  # checks only; publish advances the branches
      packages: write  # the candidate image goes to ghcr.io
    outputs:
      candidate_sha: ${{ steps.prepare.outputs.prewalk_sha }}
      candidate_digest: ${{ steps.image.outputs.digest }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0  # the merge needs the full history
          persist-credentials: false  # this job never writes to the fork

      # prepare merges upstream main into the fork's prewalk-maintenance
      # (or main on a fresh fork), leaves HEAD on the candidate and writes
      # its sha to prewalk_sha. A conflict fails the run here; no remote
      # is written until advance, the last push of the run.
      - name: Prepare the candidate (merge upstream main)
        id: prepare
        run: build/prewalk-sync.sh prepare --origin-url "$FORK_URL" --upstream-url "$UPSTREAM_URL"

      # The sync logic itself, in throwaway local repositories: upstream,
      # fork, a racing client, no network, nothing outside a temp dir.
      - name: Test the sync script (throwaway local repos)
        timeout-minutes: 10
        run: bash build/prewalk-sync-test.sh

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # the repo's pinned Bun (as in test.yml), so the plugin tests run for
      # real instead of skipping
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      # Patch-scoped checks only, by the owner's decision: this fork gates
      # its own patches, and upstream's own problems stay with the
      # maintainers. gofmt covers just the Go files the fork's patch
      # changes (the fork's diff against upstream main after prepare; the
      # prewalk-upstream remote is prepare's), vet the packages it touches.
      # No whole-tree test run here.
      - name: Check the patch (gofmt on changed files, vet on touched packages)
        timeout-minutes: 30
        run: |
          set -o pipefail
          isolated_home=$(mktemp -d)
          trap 'chmod -R u+w "$isolated_home"; rm -rf "$isolated_home"' EXIT
          gopath=$(go env GOPATH)
          modcache=$(go env GOMODCACHE)
          buildcache=$(go env GOCACHE)
          isolated() {
            HOME="$isolated_home" GOPATH="$gopath" GOMODCACHE="$modcache" GOCACHE="$buildcache" "$@"
          }
          mapfile -t patched_files < <(git diff --name-only --diff-filter=ACMR \
            refs/remotes/prewalk-upstream/main...HEAD -- '*.go')
          echo "patched Go files (${#patched_files[@]}):"
          printf '%s\n' "${patched_files[@]:-<none>}"
          if [ "${#patched_files[@]}" -gt 0 ]; then
            bad=$(isolated gofmt -l "${patched_files[@]}")
            if [ -n "$bad" ]; then
              echo "not gofmt'd:"; echo "$bad"; exit 1
            fi
          fi
          isolated go vet -tags nogui \
            ./internal/gateway/ ./internal/plugin/ ./internal/usage/ \
            ./internal/budget/ ./internal/gui/

      # The fork's own patch tests, nothing broader (the owner's decision;
      # upstream's problems are the maintainers' to fix). JSON results must
      # show each named test passing with no skipped test or subtest, so a
      # missing Bun (the loop test skips without it) fails the run instead
      # of quietly not running.
      - name: Verify the patch tests actually run
        timeout-minutes: 30
        run: |
          set -euo pipefail
          bun --version
          test "$(bun --version)" = 1.4.2
          isolated_home=$(mktemp -d)
          trap 'chmod -R u+w "$isolated_home"; rm -rf "$isolated_home"' EXIT
          export GOPATH="$(go env GOPATH)" GOMODCACHE="$(go env GOMODCACHE)" GOCACHE="$(go env GOCACHE)"
          export HOME="$isolated_home"
          tests='^(TestPluginForwardUsageThroughHost|TestPluginForwardGrantBoundaries|TestProviderWrapperKeepsAuditButCountsNoConsumption|TestProviderWrapperPreservesCallerTokenBudget|TestContextCountsProviderForwardingChildOnce|TestPluginPageReadsGroups)$'
          go test -v -json -timeout 20m -tags nogui -count=1 -run "$tests" \
            ./internal/gateway/ ./internal/usage/ \
            ./internal/budget/ ./internal/gui/ | tee "$RUNNER_TEMP/prewalk-tests.jsonl"
          jq -s -e '
            [ .[] | select(.Action == "skip" and .Test != null) ] as $skips |
            [ .[] | select(.Action == "pass" and .Test != null) | .Test ] as $passes |
            ($skips | length == 0) and
            (["TestPluginForwardUsageThroughHost", "TestPluginForwardGrantBoundaries",
              "TestProviderWrapperKeepsAuditButCountsNoConsumption", "TestProviderWrapperPreservesCallerTokenBudget",
              "TestContextCountsProviderForwardingChildOnce", "TestPluginPageReadsGroups"] - $passes | length == 0)
          ' "$RUNNER_TEMP/prewalk-tests.jsonl"

      # A local single-arch build first: if the image can't serve, the
      # multi-platform push below never happens and prewalk-latest stays
      # where it was.
      - name: Smoke test the image (local build)
        timeout-minutes: 45
        env:
          CANDIDATE_SHA: ${{ steps.prepare.outputs.prewalk_sha }}
        run: |
          echo "$CANDIDATE_SHA" | grep -Eq '^[0-9a-f]{40}$' || { echo "bad candidate sha: $CANDIDATE_SHA"; exit 1; }
          docker build --load --build-arg VERSION=prewalk-"$CANDIDATE_SHA" -t magpie-prewalk-smoke .
          smoke_key=$(openssl rand -hex 24)
          echo "::add-mask::$smoke_key"
          printf '%s' "$smoke_key" | docker run --rm -i -v smoke-ci:/config \
            magpie-prewalk-smoke gateway-key add ci-smoke --key - >/dev/null
          docker run -d --name smoke -v smoke-ci:/config -p 13425:3425 magpie-prewalk-smoke
          ready=0
          for _ in $(seq 1 30); do
            if curl -fsS -o /dev/null -H "Authorization: Bearer $smoke_key" \
              http://127.0.0.1:13425/v1/models; then ready=1; break; fi
            sleep 1
          done
          [ "$ready" = 1 ]
          unauthenticated_code=$(curl -s -o /dev/null -w '%{http_code}' \
            http://127.0.0.1:13425/v1/models)
          [ "$unauthenticated_code" = 401 ]
          models_code=$(curl -s -o /tmp/models.json -w '%{http_code}' \
            -H "Authorization: Bearer $smoke_key" http://127.0.0.1:13425/v1/models)
          echo "v1/models answered HTTP $models_code"
          [ "$models_code" = 200 ]
          chat_code=$(curl -s -o /tmp/body.json -w '%{http_code}' \
            -H "Authorization: Bearer $smoke_key" -H 'Content-Type: application/json' \
            -d '{"model":"ci-unknown-model","messages":[{"role":"user","content":"hi"}]}' \
            http://127.0.0.1:13425/v1/chat/completions)
          echo "chat/completions answered HTTP $chat_code"
          cat /tmp/body.json; echo
          [ "$chat_code" -ge 400 ] && [ "$chat_code" -lt 500 ]
          jq -e '.error.type' /tmp/body.json > /dev/null

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # A candidate tag may remain after a rejected advance. The build's
      # digest, not this mutable tag, identifies the image for publication.
      - name: Build and push the candidate image
        id: image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          provenance: false
          push: true
          tags: ${{ env.IMAGE }}:prewalk-${{ steps.prepare.outputs.prewalk_sha }}
          build-args: |
            VERSION=prewalk-${{ steps.prepare.outputs.prewalk_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The candidate is on no remote yet, so it travels to publish as a
      # self-contained git bundle: one artifact, one sha, no credentials.
      - name: Hand the verified candidate to publish (git bundle)
        run: |
          set -euo pipefail
          git bundle create "$RUNNER_TEMP/prewalk-candidate.bundle" HEAD
          git bundle verify "$RUNNER_TEMP/prewalk-candidate.bundle" >/dev/null
      - uses: actions/upload-artifact@v6
        with:
          name: prewalk-candidate-bundle
          path: ${{ runner.temp }}/prewalk-candidate.bundle
          retention-days: 1
          if-no-files-found: error
          overwrite: true  # a re-run of sync replaces the artifact

  publish:
    needs: sync
    if: github.repository == 'RayenAlex/magpie'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: prewalk-publish
    permissions:
      contents: read  # the checkout of the trusted workflow revision
      packages: write  # the rolling image tags on ghcr.io
    steps:
      # Nothing from the candidate runs here: its tree arrives as data in
      # the bundle, and the advance script is the trigger revision's own
      # copy, kept outside the candidate's repository.
      - name: Download the verified candidate (git bundle)
        uses: actions/download-artifact@v7
        with:
          name: prewalk-candidate-bundle
          path: ${{ runner.temp }}

      # Checkout with a plain, short-lived read token whose expiry is tied
      # to this job; the app installation token is minted only afterwards.
      - name: Check out the trusted workflow revision
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Restore the verified candidate from the bundle
        id: restore
        env:
          CANDIDATE_SHA: ${{ needs.sync.outputs.candidate_sha }}
          CANDIDATE_DIGEST: ${{ needs.sync.outputs.candidate_digest }}
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "bad candidate sha: $CANDIDATE_SHA"; exit 1; }
          [[ "$CANDIDATE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "bad candidate digest: $CANDIDATE_DIGEST"; exit 1; }
          mkdir -p "$RUNNER_TEMP/trusted" "$RUNNER_TEMP/candidate"
          # the advance script of the revision this run was started by,
          # kept outside the candidate tree
          cp build/prewalk-sync.sh "$RUNNER_TEMP/trusted/prewalk-sync.sh"
          git init --quiet "$RUNNER_TEMP/candidate"
          git -C "$RUNNER_TEMP/candidate" fetch --quiet "$RUNNER_TEMP/prewalk-candidate.bundle" HEAD
          got=$(git -C "$RUNNER_TEMP/candidate" rev-parse FETCH_HEAD)
          [ "$got" = "$CANDIDATE_SHA" ] || { echo "bundle HEAD $got is not the verified candidate $CANDIDATE_SHA"; exit 1; }
          git -C "$RUNNER_TEMP/candidate" checkout --quiet --detach "$CANDIDATE_SHA"

      # The only credential that may push workflow files: a GitHub App
      # installation token with workflows permission, scoped to this
      # repository, minted fresh for this step's callers and short-lived.
      - name: Mint the fork app's installation token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.PREWALK_SYNC_APP_ID }}
          private-key: ${{ secrets.PREWALK_SYNC_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-workflows: write

      - name: Check the app identity against PREWALK_SYNC_BOT
        env:
          PREWALK_SYNC_BOT: ${{ vars.PREWALK_SYNC_BOT }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          [ -n "$PREWALK_SYNC_BOT" ] || { echo "PREWALK_SYNC_BOT (repository variable) is not set; see docs/prewalk-maintenance.md"; exit 1; }
          [ "${APP_SLUG}[bot]" = "$PREWALK_SYNC_BOT" ] \
            || { echo "token app ${APP_SLUG}[bot] is not $PREWALK_SYNC_BOT"; exit 1; }

      # advance fast-forwards both fork branches to the same verified sha
      # the checks ran on; a branch that moved ahead rejects the run. The
      # token reaches git only through process-level environment config
      # matched to the fork's exact HTTPS URL: nothing is written to disk,
      # to the remote URL, or to git's config files.
      - name: Advance the fork branches to the verified candidate
        id: advance
        working-directory: ${{ runner.temp }}/candidate
        env:
          CANDIDATE_SHA: ${{ needs.sync.outputs.candidate_sha }}
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          [ -n "$APP_TOKEN" ] || { echo "GitHub App installation token is empty: PREWALK_SYNC_APP_ID / PREWALK_SYNC_APP_PRIVATE_KEY are not configured in the prewalk-publish environment"; exit 1; }
          export GIT_TERMINAL_PROMPT=0
          basic=$(printf 'x-access-token:%s' "$APP_TOKEN" | base64 | tr -d '\n')
          echo "::add-mask::$basic"
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0="http.${FORK_URL}.extraheader"
          export GIT_CONFIG_VALUE_0="Authorization: Basic $basic"
          "$RUNNER_TEMP/trusted/prewalk-sync.sh" advance --sha "$CANDIDATE_SHA" --origin-url "$FORK_URL"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # Publish both rolling tags only after the advance succeeded.
      - name: Point latest and prewalk-latest at the candidate image
        env:
          CANDIDATE_DIGEST: ${{ needs.sync.outputs.candidate_digest }}
        run: |
          [[ "$CANDIDATE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          docker buildx imagetools create -t "$IMAGE:latest" -t "$IMAGE:prewalk-latest" "$IMAGE@$CANDIDATE_DIGEST"
          for tag in latest prewalk-latest; do
            got=$(docker buildx imagetools inspect "$IMAGE:$tag" --format '{{json .}}' | jq -er '.manifest.digest')
            echo "candidate $CANDIDATE_DIGEST, $tag $got"
            [ "$CANDIDATE_DIGEST" = "$got" ]
          done
